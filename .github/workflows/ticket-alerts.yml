name: Seahawks ticket alerts

on:
  # The tracker does source requests hourly, except in the final week before a
  # configured kickoff, when it requests them every 15 minutes.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tracker tests
        run: python -m unittest discover -s tests
      - name: Check ticket sources and email price drops
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_USER: ${{ secrets.GMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: python tracker.py --scheduled
      - name: Persist observed prices and alert history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json
          git diff --cached --quiet || git commit -m "chore: update ticket price state"
          git push
